version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: aau_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aau_user
      POSTGRES_PASSWORD: aau_password
      POSTGRES_DB: aau_registration
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aau_user -d aau_registration"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aau_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
